<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - DTU Health Center</title>
    <link rel="stylesheet" href="css/style.css?v=2.2">
</head>
<body>

    <!-- Dynamic Modern Floating Pill Navbar Mount -->
    <div id="navbar-mount"></div>

    <!-- Main Container -->
    <main class="container section">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 class="section-title">Student Medical Profile</h1>
            <p style="color: var(--text-muted); margin-top: 0.5rem; font-size: 0.92rem;">
                Keep your university healthcare information up to date for fast appointment booking and medical history tracking.
            </p>
        </div>

        <div class="card" style="max-width: 680px; margin: 0 auto; padding: 28px;">
            <form id="studentProfileForm" onsubmit="saveProfile(event)">
            <div class="form-group">
                <label class="form-label" for="fullName">Full Name *</label>
                <input type="text" id="fullName" class="form-input" placeholder="e.g. Rahul Sharma" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                <div class="form-group">
                    <label class="form-label" for="dob">Date of Birth *</label>
                    <input type="date" id="dob" class="form-input" required value="2003-05-15">
                </div>
                <div class="form-group">
                    <label class="form-label" for="bloodGroup">Blood Group *</label>
                    <select id="bloodGroup" class="form-select" required>
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+" selected>B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                <div class="form-group">
                    <label class="form-label" for="rollNo">DTU Roll Number *</label>
                    <input type="text" id="rollNo" class="form-input" placeholder="e.g. 2K22/CO/123" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="branch">Branch / Department *</label>
                    <select id="branch" class="form-select" required>
                        <option value="">Select Branch</option>
                        <option value="Computer Science & Engineering" selected>Computer Science & Engineering (COE)</option>
                        <option value="Information Technology">Information Technology (IT)</option>
                        <option value="Software Engineering">Software Engineering (SE)</option>
                        <option value="Electronics & Communication">Electronics & Communication (ECE)</option>
                        <option value="Electrical Engineering">Electrical Engineering (EE)</option>
                        <option value="Mechanical Engineering">Mechanical Engineering (ME)</option>
                        <option value="Civil Engineering">Civil Engineering (CE)</option>
                        <option value="Biotechnology">Biotechnology (BT)</option>
                        <option value="Engineering Physics">Engineering Physics (EP)</option>
                        <option value="Mathematics & Computing">Mathematics & Computing (MCE)</option>
                    </select>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                <div class="form-group">
                    <label class="form-label" for="year">Year of Study *</label>
                    <select id="year" class="form-select" required>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year" selected>3rd Year</option>
                        <option value="4th Year">4th Year</option>
                        <option value="Postgraduate / M.Tech">Postgraduate / M.Tech</option>
                        <option value="Ph.D. Scholar">Ph.D. Scholar</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="phone">Contact Phone *</label>
                    <input type="tel" id="phone" class="form-input" placeholder="e.g. 9876543210" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">DTU Official Email (@dtu.ac.in) *</label>
                <input type="email" id="email" class="form-input" placeholder="e.g. student.22co123@dtu.ac.in" required>
            </div>

            <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                <button type="button" class="btn btn-pill-glass" onclick="window.location.href='student-dashboard.html'">Cancel</button>
                <button type="submit" class="btn btn-pill-primary">Save Profile & Continue</button>
            </div>
        </form>
        </div>
    </main>

    <!-- Dynamic Footer Mount -->
    <div id="footer-mount"></div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        function loadCurrentProfile() {
            const user = checkLogin('student');
            if (!user) return;

            const saved = localStorage.getItem('studentProfile');
            if (saved) {
                try {
                    const p = JSON.parse(saved);
                    if (p.name) document.getElementById('fullName').value = p.name;
                    if (p.dob) document.getElementById('dob').value = p.dob;
                    if (p.bloodGroup) document.getElementById('bloodGroup').value = p.bloodGroup;
                    if (p.rollNo) document.getElementById('rollNo').value = p.rollNo;
                    if (p.branch) document.getElementById('branch').value = p.branch;
                    if (p.year) document.getElementById('year').value = p.year;
                    if (p.phone) document.getElementById('phone').value = p.phone;
                    if (p.email || p.dtuEmail) document.getElementById('email').value = p.email || p.dtuEmail;
                } catch (e) {}
            } else if (user) {
                if (user.name) document.getElementById('fullName').value = user.name;
                if (user.email) document.getElementById('email').value = user.email;
            }
        }

        function saveProfile(e) {
            e.preventDefault();

            const profile = {
                name: document.getElementById('fullName').value.trim(),
                dob: document.getElementById('dob').value,
                bloodGroup: document.getElementById('bloodGroup').value,
                rollNo: document.getElementById('rollNo').value.trim(),
                branch: document.getElementById('branch').value,
                year: document.getElementById('year').value,
                phone: document.getElementById('phone').value.trim(),
                email: document.getElementById('email').value.trim(),
                dtuEmail: document.getElementById('email').value.trim()
            };

            localStorage.setItem('studentProfile', JSON.stringify(profile));

            const rawUser = localStorage.getItem('currentUser');
            let user = rawUser ? JSON.parse(rawUser) : {};
            user.role = 'student';
            user.name = profile.name;
            user.email = profile.email;
            localStorage.setItem('currentUser', JSON.stringify(user));
            localStorage.setItem('userRole', 'student');

            showNotification('Profile updated successfully!', 'success');

            setTimeout(() => {
                window.location.href = 'student-dashboard.html';
            }, 300);
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof initData === 'function') initData();
            if (typeof loadNavbar === 'function') loadNavbar('student');
            if (typeof loadFooter === 'function') loadFooter();
            loadCurrentProfile();
        });
    </script>
</body>
</html>
