<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DTU Health Center</title>
    <link rel="stylesheet" href="css/style.css?v=2.2">
</head>
<body>

    <!-- Dynamic Modern Floating Pill Navbar Mount -->
    <div id="navbar-mount"></div>

    <!-- Centered Login Box -->
    <div class="login-container" style="flex: 1; padding: 2.5rem 1rem;">
        
        <!-- CARD 1: LOGIN BOX -->
        <div class="login-box" id="authBox">
            <div style="text-align: center; margin-bottom: 1.8rem;">
                <div style="display: inline-flex; align-items: center; justify-content: center; width: 50px; height: 50px; border-radius: 50%; background: rgba(230, 57, 70, 0.15); font-size: 1.6rem; margin-bottom: 0.5rem; border: 1px solid rgba(230, 57, 70, 0.3);">
                    🏥
                </div>
                <h2 style="color: #ffffff; font-size: 1.55rem; font-weight: 800; letter-spacing: -0.02em;">Health Portal Login</h2>
                <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 2px;">Delhi Technological University</p>
            </div>

            <!-- Tabs -->
            <div class="login-tabs">
                <button type="button" class="login-tab active" id="studentTabBtn" onclick="switchTab('student')">Student Login</button>
                <button type="button" class="login-tab" id="doctorTabBtn" onclick="switchTab('doctor')">Doctor Login</button>
            </div>

            <!-- STUDENT LOGIN FORM -->
            <form id="studentLoginForm" onsubmit="handleStudentLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="studentEmail">DTU Student Email</label>
                    <input type="email" id="studentEmail" class="form-input" placeholder="e.g. rahul@dtu.ac.in" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="studentPassword">Password</label>
                    <input type="password" id="studentPassword" class="form-input" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem; margin-top: 0.5rem;">
                    Sign In as Student
                </button>
            </form>

            <!-- DOCTOR LOGIN FORM -->
            <form id="doctorLoginForm" onsubmit="handleDoctorLogin(event)" style="display: none;">
                <div class="form-group">
                    <label class="form-label" for="doctorEmail">Doctor Email</label>
                    <input type="email" id="doctorEmail" class="form-input" placeholder="e.g. doctor@dtu.ac.in" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="doctorPassword">Password</label>
                    <input type="password" id="doctorPassword" class="form-input" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem; margin-top: 0.5rem;">
                    Sign In as Doctor
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-light);">
                Need medical emergency assistance? <br>
                <a href="emergency.html" style="color: var(--danger); font-weight: 600;">Call Emergency Help (102)</a>
            </div>
        </div>

    </div>

    <!-- Dynamic Footer Mount -->
    <div id="footer-mount"></div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof initData === 'function') initData();
            if (typeof loadNavbar === 'function') loadNavbar();
            if (typeof loadFooter === 'function') loadFooter();
        });

        // Switch between Student and Doctor tabs
        function switchTab(role) {
            const studentBtn = document.getElementById('studentTabBtn');
            const doctorBtn = document.getElementById('doctorTabBtn');
            const studentForm = document.getElementById('studentLoginForm');
            const doctorForm = document.getElementById('doctorLoginForm');

            if (role === 'student') {
                studentBtn.classList.add('active');
                doctorBtn.classList.remove('active');
                studentForm.style.display = 'block';
                doctorForm.style.display = 'none';
            } else {
                doctorBtn.classList.add('active');
                studentBtn.classList.remove('active');
                doctorForm.style.display = 'block';
                studentForm.style.display = 'none';
            }
        }

        // Handle Student Login (Decoupled - ready for new authentication provider)
        function handleStudentLogin(event) {
            event.preventDefault();
            const email = document.getElementById('studentEmail').value.trim();
            const password = document.getElementById('studentPassword').value;

            if (!email) {
                alert('Please enter your DTU student email');
                return;
            }

            const rawName = email.split('@')[0].replace(/[._-]/g, ' ');
            const formattedName = rawName.charAt(0).toUpperCase() + rawName.slice(1);

            const user = {
                role: 'student',
                email: email,
                name: formattedName || 'Student'
            };
            localStorage.setItem('currentUser', JSON.stringify(user));
            localStorage.setItem('userRole', 'student');

            const savedProfile = localStorage.getItem('studentProfile');
            if (!savedProfile) {
                const defaultProfile = {
                    name: formattedName || 'Rahul Sharma',
                    dob: '2003-05-15',
                    bloodGroup: 'B+',
                    rollNo: '2K22/CO/123',
                    branch: 'Computer Science & Engineering',
                    year: '3rd Year',
                    phone: '9876543210',
                    email: email,
                    dtuEmail: email
                };
                localStorage.setItem('studentProfile', JSON.stringify(defaultProfile));
            }

            window.location.href = 'student-dashboard.html';
        }

        // Handle Doctor Login (Decoupled - ready for new authentication provider)
        function handleDoctorLogin(event) {
            event.preventDefault();
            const email = document.getElementById('doctorEmail').value.trim();
            const password = document.getElementById('doctorPassword').value;

            if (!email) {
                alert('Please enter doctor email');
                return;
            }

            let doctorData = null;
            if (typeof doctors !== 'undefined' && Array.isArray(doctors)) {
                doctorData = doctors.find(d => d.email && d.email.toLowerCase() === email.toLowerCase());
            }

            if (!doctorData) {
                const namePart = email.split('@')[0].replace(/^dr\.?/i, '').replace(/[._-]/g, ' ');
                doctorData = {
                    id: Date.now(),
                    name: 'Dr. ' + (namePart ? namePart.charAt(0).toUpperCase() + namePart.slice(1) : 'Rajesh Sharma'),
                    department: 'General Medicine (OPD)',
                    qualification: 'MBBS, MD',
                    photo: '👨‍⚕️',
                    email: email
                };
            }

            const doctorUser = {
                role: 'doctor',
                ...doctorData
            };

            localStorage.setItem('currentUser', JSON.stringify(doctorUser));
            localStorage.setItem('userRole', 'doctor');

            window.location.href = 'doctor-dashboard.html';
        }
    </script>
</body>
</html>
